services:
  app-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod

    container_name: intelligent-broker-prod

    ports:
      - "3000:3000"

    env_file:
      - ./config/.env.prod

    depends_on:
      - mongo

  mongo:
    image: mongo

    container_name: intelligent-broker-mongo

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: